name: CI

on:
  push:
    branches:
      - main
      - release/0.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce and report exact source revision
        env:
          AETHER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AETHER_JOB: test-${{ matrix.os }}
        run: >-
          node -e "const cp=require('node:child_process');const fs=require('node:fs');const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const expected=process.env.AETHER_EXPECTED_SHA;if(actual!==expected)throw new Error('checkout mismatch: expected '+expected+', got '+actual);const record={schema:'aether.exact-head-source/v1',expected,actual,job:process.env.AETHER_JOB,os:process.platform};const json=JSON.stringify(record);console.log(json);fs.writeFileSync('aether-exact-head-source.json',json+'\n')"

      - name: Upload exact-source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-exact-head-test-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: aether-exact-head-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json's test script uses `node --test --test-isolation=none`,
          # which Node 20 doesn't support ("bad option") — match engines.node.
          node-version: '24'
          cache: 'npm'

      - name: Set up Python for the ATS runtime writer lease
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Build and test
        run: npm test

      # Emit the compact, machine-readable package summary on both release
      # platforms. The release-coherence suite binds the packet's named host
      # measurement to this same npm pack result, so a value from one runner
      # cannot be relabelled as evidence from the other.
      - name: Emit exact-head production package report
        run: npm run verify:production

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce and report exact source revision
        env:
          AETHER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AETHER_JOB: supply-chain
        run: >-
          node -e "const cp=require('node:child_process');const fs=require('node:fs');const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const expected=process.env.AETHER_EXPECTED_SHA;if(actual!==expected)throw new Error('checkout mismatch: expected '+expected+', got '+actual);const record={schema:'aether.exact-head-source/v1',expected,actual,job:process.env.AETHER_JOB,os:process.platform};const json=JSON.stringify(record);console.log(json);fs.writeFileSync('aether-exact-head-source.json',json+'\n')"

      - name: Upload exact-source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-exact-head-supply-chain-${{ github.event.pull_request.head.sha || github.sha }}
          path: aether-exact-head-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Test npm bulk audit retry
        run: node --test scripts/npm-bulk-audit.test.mjs

      - name: Audit dependencies
        shell: bash
        run: |
          set -o pipefail
          audit_json="${RUNNER_TEMP}/npm-audit.json"
          audit_stderr="${RUNNER_TEMP}/npm-audit.stderr"
          set +e
          npm audit --audit-level=high --json --fetch-retries=0 --fetch-timeout=300000 >"$audit_json" 2>"$audit_stderr"
          audit_status=$?
          set -e
          cat "$audit_json"
          cat "$audit_stderr" >&2

          set +e
          node scripts/npm-bulk-audit.mjs --classify-npm-audit-result "$audit_status" "$audit_json" > aether-npm-audit-classification.json
          classification_status=$?
          set -e
          cat aether-npm-audit-classification.json

          case "$classification_status" in
            0)
              exit 0
              ;;
            10)
              echo "::warning title=npm audit compressed request unavailable::Retrying the same npm bulk advisory endpoint with an identity-encoded exact-lock superset; only an empty advisory map can pass."
              bulk_stderr="${RUNNER_TEMP}/npm-bulk-audit.stderr"
              set +e
              node scripts/npm-bulk-audit.mjs > aether-npm-bulk-audit.json 2>"$bulk_stderr"
              bulk_status=$?
              set -e
              cat aether-npm-bulk-audit.json
              cat "$bulk_stderr" >&2
              if [ "$bulk_status" -ne 0 ]; then
                exit "$bulk_status"
              fi
              ;;
            *)
              if [ "$audit_status" -eq 0 ]; then
                exit 1
              fi
              exit "$audit_status"
              ;;
          esac

      - name: Upload dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/npm-audit.stderr
            ${{ runner.temp }}/npm-bulk-audit.stderr
            aether-npm-audit-classification.json
            aether-npm-bulk-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Type-check exact head
        run: npm run typecheck

      - name: Verify generated documentation
        run: npm run docs:check

      - name: Verify production package and policy
        run: npm run verify:production

      - name: Verify live release truth
        run: npm run release:truth

      - name: Dry-run the exact package without lifecycle scripts
        run: npm pack --dry-run --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > aether-agents.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-agents-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: aether-agents.cdx.json
          if-no-files-found: error
          retention-days: 90

  pypi-launcher:
    name: PyPI launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce and report exact source revision
        env:
          AETHER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AETHER_JOB: pypi-launcher
        run: >-
          node -e "const cp=require('node:child_process');const fs=require('node:fs');const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const expected=process.env.AETHER_EXPECTED_SHA;if(actual!==expected)throw new Error('checkout mismatch: expected '+expected+', got '+actual);const record={schema:'aether.exact-head-source/v1',expected,actual,job:process.env.AETHER_JOB,os:process.platform};const json=JSON.stringify(record);console.log(json);fs.writeFileSync('aether-exact-head-source.json',json+'\n')"

      - name: Upload exact-source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-exact-head-pypi-launcher-${{ github.event.pull_request.head.sha || github.sha }}
          path: aether-exact-head-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor requires-python declares, so the published wheel is proved on the
          # oldest interpreter it claims to support.
          python-version: '3.10'

      - name: Launcher version tracks package.json
        run: node packages/sync-version.mjs --check

      - name: Refuse runtime dependencies
        working-directory: packages/pypi-cli
        run: grep -qx 'dependencies = \[\]' pyproject.toml

      - name: Unit tests
        working-directory: packages/pypi-cli
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Type check
        working-directory: packages/pypi-cli
        run: |
          python -m pip install --disable-pip-version-check mypy==2.3.1
          python -m mypy src

      - name: Build and smoke-test the wheel
        working-directory: packages/pypi-cli
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check build==1.4.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/launcher"
          "$RUNNER_TEMP/launcher/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/launcher/bin/aether-agent" self --version
          "$RUNNER_TEMP/launcher/bin/aether-agent" self --help > /dev/null
