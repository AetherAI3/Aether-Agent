name: CI

on:
  push:
    branches:
      - main
      - release/0.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json's test script uses `node --test --test-isolation=none`,
          # which Node 20 doesn't support ("bad option") — match engines.node.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and test
        run: npm test

      # Emit the compact, machine-readable package summary on both release
      # platforms. The release-coherence suite binds the packet's named host
      # measurement to this same npm pack result, so a value from one runner
      # cannot be relabelled as evidence from the other.
      - name: Emit exact-head production package report
        run: npm run verify:production

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify production package and policy
        run: npm run verify:production

      - name: Verify live release truth
        run: npm run release:truth

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > aether-agents.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-agents-sbom-${{ github.sha }}
          path: aether-agents.cdx.json
          if-no-files-found: error
          retention-days: 90

  pypi-launcher:
    name: PyPI launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor requires-python declares, so the published wheel is proved on the
          # oldest interpreter it claims to support.
          python-version: '3.10'

      - name: Launcher version tracks package.json
        run: node packages/sync-version.mjs --check

      - name: Refuse runtime dependencies
        working-directory: packages/pypi-cli
        run: grep -qx 'dependencies = \[\]' pyproject.toml

      - name: Unit tests
        working-directory: packages/pypi-cli
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Type check
        working-directory: packages/pypi-cli
        run: |
          python -m pip install --disable-pip-version-check mypy==2.3.1
          python -m mypy src

      - name: Build and smoke-test the wheel
        working-directory: packages/pypi-cli
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check build==1.4.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/launcher"
          "$RUNNER_TEMP/launcher/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/launcher/bin/aether-agent" self --version
          "$RUNNER_TEMP/launcher/bin/aether-agent" self --help > /dev/null
