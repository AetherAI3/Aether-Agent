name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# PR 336 uses the exact-source job log as interim evidence while the Actions
# artifact quota is full. Other runs retain the required upload gate.
env:
  AETHER_LOG_ONLY_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 336 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/release-v4.21.0' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.AETHER_CI_SELF_HOSTED_PR == format('{0}', github.event.pull_request.number)) || (vars.AETHER_CI_SELF_HOSTED == '1' && vars.AETHER_CI_SELF_HOSTED_MAIN == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) && '-self-hosted' || '' }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 336 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/release-v4.21.0' && vars.AETHER_CI_SELF_HOSTED_PR == '336') && fromJSON('["self-hosted","Linux","X64","vps3-repair"]') || (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.AETHER_CI_SELF_HOSTED_PR == format('{0}', github.event.pull_request.number)) || (vars.AETHER_CI_SELF_HOSTED == '1' && vars.AETHER_CI_SELF_HOSTED_MAIN == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) && fromJSON('["self-hosted","Linux","X64","aether-agent-ci"]') || 'ubuntu-latest') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce and report exact source revision
        env:
          AETHER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AETHER_JOB: codeql
        run: >-
          node -e "const cp=require('node:child_process');const fs=require('node:fs');const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const expected=process.env.AETHER_EXPECTED_SHA;if(actual!==expected)throw new Error('checkout mismatch: expected '+expected+', got '+actual);const record={schema:'aether.exact-head-source/v1',expected,actual,job:process.env.AETHER_JOB,os:process.platform};const json=JSON.stringify(record);console.log(json);fs.writeFileSync('aether-exact-head-source.json',json+'\n')"

      - name: Upload exact-source evidence
        id: exact_source_upload
        if: ${{ env.AETHER_LOG_ONLY_RELEASE_PR != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # Finish analysis before failing on unavailable evidence.
        with:
          name: aether-exact-head-codeql-${{ github.event.pull_request.head.sha || github.sha }}
          path: aether-exact-head-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          ram: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 336 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/release-v4.21.0') && '6000' || (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.AETHER_CI_SELF_HOSTED_PR == format('{0}', github.event.pull_request.number)) || (vars.AETHER_CI_SELF_HOSTED == '1' && vars.AETHER_CI_SELF_HOSTED_MAIN == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) && '3000' || '6000') }}
          threads: 2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Record interim evidence in downloadable logs
        if: always()
        env:
          AETHER_EVIDENCE_JOB: codeql
          AETHER_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AETHER_UPLOAD_OUTCOMES: exact=${{ steps.exact_source_upload.outcome }}
        run: node scripts/ci-interim-evidence.mjs aether-exact-head-source.json

      - name: Require artifact upload
        if: ${{ always() && env.AETHER_LOG_ONLY_RELEASE_PR != 'true' && steps.exact_source_upload.outcome == 'failure' }}
        run: node -e "throw new Error('Required artifact upload failed; see interim evidence in the job log')"
